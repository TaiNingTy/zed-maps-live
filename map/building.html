<body>
  <div id="app">
    <div id="stage">
      <div id="labels" aria-hidden="true"></div>
      <div id="hover" hidden></div>
      <div id="main-plan" hidden></div>
      <svg id="plan-leader" aria-hidden="true" hidden><polyline pathLength="1"/></svg>
      <output id="plan-kind" aria-live="polite" hidden><strong></strong><small></small></output>
      <div class="seg" id="plan-controls" role="group" aria-label="Plan zoom" hidden>
        <button type="button" data-zoom="out" aria-label="Zoom out">−</button>
        <button type="button" data-zoom="in" aria-label="Zoom in">+</button>
        <button type="button" data-zoom="fit">Fit</button>
      </div>
      <div id="toolbar">
        <div class="seg" id="viewer-modes" role="group" aria-label="View" hidden>
          <button data-view="3d" aria-pressed="true">3D</button>
          <button data-view="stack" aria-pressed="false">Floor stack</button>
          <button data-view="plan" aria-pressed="false">Plan</button>
        </div>
        <label class="spread">Spread <input id="spread" type="range" min="0" max="1.5" step="0.05" value="1" aria-label="Spread the floors apart"></label>
        <div class="seg" id="modes" role="group" aria-label="Colour">
          <button data-mode="use" aria-pressed="true">Use</button>
          <button data-mode="evidence" aria-pressed="false">Evidence</button>
          <button data-mode="systems" aria-pressed="false" hidden>Systems</button>
        </div>
        <div class="seg" role="group" aria-label="Route"><button id="route-btn" aria-pressed="true">Edge route</button></div>
        <button id="empire-envelope" class="toolbar-action" hidden>Envelope · Transparent</button>
        <button id="close" hidden>Back to map</button>
      </div>
      <div id="legend"></div>
    </div>
    <aside id="panel">
      <div id="head">
        <h1 id="page-title">Floor by floor</h1>
        <p class="sub" id="page-sub"></p>
        <details id="viewer-options" hidden>
          <summary>Display and routes</summary>
          <div id="viewer-display" role="group" aria-label="Display"></div>
          <div id="viewer-routes" role="group" aria-label="Routes"></div>
        </details>
        <div id="tabs" role="group" aria-label="Building"></div>
        <div id="floor-actions" hidden>
          <button id="floor-context" aria-pressed="false">Isolate floor</button>
          <button id="locate-floor">Locate floor</button>
          <small id="floor-offscreen" hidden>Selected floor is out of view</small>
        </div>
      </div>
      <div id="floors"></div>
      <div id="detail"></div>
    </aside>
  </div>

    function cptRouteCam() {

    const ray = new THREE.Raycaster();

    canvas.addEventListener("pointerleave", () => { $("hover").hidden = true; });

    // In the app this page opens over the map: the button goes back
    if (window.parent !== window) {
      $("close").hidden = false;

    }

    if (window.parent === window) $("close").onclick = () => location.assign("./");
    syncViewerMode();

    new ResizeObserver(() => { resizeView(); updateFloorControls(); positionPlanNote(); }).observe(stage);
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { rebuildAll(); buildLabels(); });

    root.add(links, routeGroup);
    if (data.systems) document.querySelector('[data-mode="systems"]').hidden = false;
    tabs(); list(); detail(null);
    rebuildAll();
    buildLabels();
    frameSelection();
    placeAll();
    const startFloor = params.get("floor");
    const empireMapEntry = MODEL === "empire-state" && window.parent !== window;
    if (!empireMapEntry && startFloor && byId[startFloor]) selectFloor(startFloor, {frame: true});

    const broadwayStation = MODEL === "57-st-7-av";
    let stationPlayer;
    if(data.station_journeys && !empireScope && !empirePreview){
      const btn=document.createElement('button');btn.textContent=(rockefeller || surveyStation || broadwayStation) ? 'Preview station route' : 'Herald Route Play';btn.id='herald-route-play';btn.className='toolbar-action';$(empireEnvelope || rockefeller || surveyStation || broadwayStation ? 'viewer-routes' : 'toolbar').append(btn);
      const pilot = MODEL === "survey-28-st-bway" && !routeSegmentView
        ? await import("./station-door-preview.js") : null;
      const journeys = pilot ? pilot.doorJourneys(data.station_journeys, floors) : data.station_journeys;
      stationPlayer=stationRoutePlayer({journeys,pilot:pilot && {create:pilot.createDoorPreview},scenarioLabels:rockefeller || Boolean(surveyStation) || broadwayStation,elevations:Object.fromEntries(floors.map(f=>[f.id,f.elev_m])),scene,camera,controls,stage,
        activate(on){if(on){if (empireEnvelope || surveyStation || broadwayStation) setViewerMode("3d");state.spread=0;state.focus=null;state.scoped=false;state.tab='station';state.route=false;$('spread').value=0;$('route-btn').setAttribute('aria-pressed','false');tabs();list();detail(null);placeAll();buildRoute();buildLegend();} $('spread').disabled=on;}});
      btn.onclick=()=>stationPlayer.open();
    }
    if (empireScope || empirePreview) $("viewer-routes").hidden = true;
    if (rockefeller || surveyStation) $("route-btn").hidden = true;
    let routePreview;
    if (empirePreview) {
      envelopeMode = 1;
      updateEmpireEnvelope();
      const path = data.route.path;
      const points = path.map(({p, floor}) => new THREE.Vector3(p[0], yOf(byId[floor]) + 1.5, -p[1]));
      const track = new THREE.CurvePath();
      const segments = [];
      for (let i = 1; i < points.length; i++) {
        if (points[i - 1].distanceToSquared(points[i]) > 0) {
          track.add(new THREE.LineCurve3(points[i - 1], points[i]));
          segments.push([path[i - 1].floor, path[i].floor]);
        }
      }
      const marker = new THREE.Mesh(new THREE.SphereGeometry(3, 12, 8),
        new THREE.MeshBasicMaterial({ color: cssv("--ink"), depthTest: false }));
      marker.renderOrder = 22;
      scene.add(marker);
      const panel = document.createElement("div");
      panel.className = "seg";
      panel.setAttribute("role", "group");
      panel.setAttribute("aria-label", "Route preview");
      panel.innerHTML = '<button type="button">Pause</button><input type="range" min="0" max="1000" value="0" aria-label="Route progress">';
      $("toolbar").append(panel);
      const [play, progress] = panel.children;
      const status = document.createElement("p");
      status.className = "sub";
      $("head").append(status);
      const lengths = track.getCurveLengths();
      const total = lengths.at(-1);
      let shownFloor;
      let previousMode;
      let elapsed = 0;
      let previous = null;
      let playing = true;
      function syncPlayback() {
        play.textContent = playing ? "Pause" : elapsed >= 22000 ? "Replay" : "Play";
      }
      play.onclick = () => {
        if (elapsed >= 22000) elapsed = 0;
        playing = !playing;
        syncPlayback();
      };
      progress.oninput = () => { elapsed = Number(progress.value) * 22; };
      routePreview = (now) => {
        if (playing && previous !== null) elapsed = Math.min(22000, elapsed + now - previous);
        previous = now;
        progress.value = elapsed / 22;
        const fraction = elapsed / 22000;
        marker.position.copy(track.getPoint(fraction));
        const distance = fraction * total;
        const index = lengths.findIndex(length => length >= distance);
        const [from, to] = segments[index < 0 ? segments.length - 1 : index];
        const floor = byId[distance < ((lengths[index - 1] || 0) + lengths[index]) / 2 ? from : to];
        if (shownFloor !== floor.id || previousMode !== viewerMode) {
          status.textContent = `Route preview · ${floor.name}`;
          if (viewerMode === "plan") detail(floor);
          shownFloor = floor.id;
          previousMode = viewerMode;
        }
        if (playing && elapsed >= 22000) {
          playing = false;
          syncPlayback();
        }
        marker.visible = viewerMode === "3d";
      };
      $("viewer-modes").querySelector('[data-view="stack"]').hidden = true;
    }
    let showRouteSegment, resumeRouteFollow, updateSegmentCamera, routeEyeCamera;
    let segmentFollowing = true;
    if (routeSegmentView) {
      envelopeMode = 1;
      const { createWalkerFigure } = await import("./walker3d.js");
      let walker;
      controls.addEventListener("start", () => { segmentFollowing = false; });
      resumeRouteFollow = () => { segmentFollowing = true; };
      let zoomStarted = performance.now();
      const offset = new THREE.Vector3();
      const target = new THREE.Vector3();
      const trail = new THREE.Group();
      const band = new THREE.MeshBasicMaterial({ transparent: true, opacity: .62, depthWrite: false });
      scene.add(trail);
      const cabin = new THREE.Group();
      const cabinMetal = new THREE.MeshStandardMaterial({ color: "#9eabb8", roughness: .6 });
      const cabinGlass = new THREE.MeshStandardMaterial({ color: "#8eb8df", transparent: true, opacity: .34, depthWrite: false });
      for (const [width, height, depth, x, y, z, material] of [
        [2.4, .16, 2.4, 0, -.08, 0, cabinMetal],
        [2.4, .16, 2.4, 0, 2.48, 0, cabinMetal],
        [.10, 2.4, 2.4, -1.15, 1.2, 0, cabinGlass],
        [.10, 2.4, 2.4, 1.15, 1.2, 0, cabinGlass],
        [2.4, 2.4, .10, 0, 1.2, 1.15, cabinGlass],
      ]) {
        const part = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
        part.position.set(x, y, z);
        cabin.add(part);
      }
      cabin.visible = false;
      scene.add(cabin);
      // The map bundle registers the same CPT floor geometry to the venue frame.
      const frame = joinedCpt
        ? (await (await fetch("data/buildings/cpt-map.json")).json()).model.frame
        : data.frame;
      const [lon, lat] = frame.origin_lonlat;
      const theta = frame.u_bearing_deg * Math.PI / 180;
      const metresX = 111320 * Math.cos(lat * Math.PI / 180);
      function localPoint([lng, latitude]) {
        const x = (lng - lon) * metresX, y = (latitude - lat) * 110540;
        return [x * Math.cos(theta) + y * Math.sin(theta), -x * Math.sin(theta) + y * Math.cos(theta)];
      }
      const towerFloors = floors.filter(f => f.building === VIEW.first).sort((a, b) => b.elev_m - a.elev_m);
      const trainGuide = MODEL === "empire-state"
        ? (await import("./station-door-preview.js")).createDoorPreview(scene) : null;
      trainGuide?.setCarVisible(false);
      const uptownPlatform = byId["station:IP"]?.zones?.find(zone => zone.name === "B D F M platform, uptown side");
      let lastStep;
      showRouteSegment = ({ scope, floor, progress, is3d, coordinates, altitude, heading, color, rim, walking, phase, points, step, doorGuide }) => {
        if (!walker) {
          walker = createWalkerFigure({ color, rim });
          scene.add(walker.fig, walker.marker);
          band.color.set(color);
          stage.style.setProperty("--segment-route", color);
        }
        const { fig, marker, swingLimbs } = walker;
        const floorBuilding = byId[floor]?.building;
        const tab = scope === "station" ? (floorBuilding === "lirr" ? "lirr" : "station")
          : floorBuilding && !["station", "lirr"].includes(floorBuilding) ? floorBuilding : VIEW.first;
        let selected = byId[floor]?.building === tab ? byId[floor] : floors.find(f => f.building === tab);
        const liftStart = byId[points[0]?.floor];
        const liftEnd = byId[points.at(-1)?.floor];
        const ridingLift = is3d && scope === "building" && step.kind === "elevator" &&
          liftStart && liftEnd && !["station", "lirr"].includes(liftStart.building) &&
          !["station", "lirr"].includes(liftEnd.building) && liftStart !== liftEnd;
        if (ridingLift) {
          const elevation = THREE.MathUtils.lerp(liftStart.elev_m, liftEnd.elev_m, progress);
          const low = Math.min(liftStart.elev_m, liftEnd.elev_m);

            : towerFloors.find(f => f.elev_m >= low && f.elev_m <= elevation + .001) || liftStart;
          altitude = elevation + 1.1;
        }
        const liftOverview = ridingLift && progress < 1;
        const indoorWalk = is3d && scope === "building" && !ridingLift && step.kind !== "escalator" && step.kind !== "stairs";
        if (indoorWalk) altitude = selected.elev_m + .32;
        band.depthTest = scope !== "building";
        marker.traverse(object => { if (object.material) {
          object.material.depthTest = scope !== "building";
          object.renderOrder = 23;
        } });
        const mode = is3d ? "3d" : "plan";
        const changedScope = state.tab !== tab;
        const isolate = is3d && scope === "building";
        const changedFloor = state.focus !== selected.id || changedScope || state.isolate !== isolate;
        const changedMode = viewerMode !== mode;
        if (lastStep !== step || changedMode) {

          for (const mesh of trail.children) mesh.geometry.dispose();
          trail.clear();
          const vertices = segmentPoints.map(({p, floor, altitude}) =>
            new THREE.Vector3(p[0], (ridingLift ? byId[floor].elev_m + 1.1 : indoorWalk && byId[floor] ? byId[floor].elev_m + .32 : altitude) - .18, -p[1]));
          for (let i = 1; i < vertices.length; i++) {
            const a = vertices[i - 1], b = vertices[i];

            trail.add(mesh);

        if (changedFloor || changedMode || lastStep !== step) {
          state.tab = tab;
          state.focus = selected.id;
          state.isolate = isolate;
          viewerMode = mode;
          syncViewerMode();
          if (changedFloor || changedMode) {
            placeAll();
            if (is3d && (segmentFollowing || changedMode) && (!ridingLift || changedMode || changedScope)) frameSelection();
            if (changedMode) zoomStarted = performance.now();
          }
          if (!is3d) detail(selected);
          lastStep = step;
        }
        if (ridingLift) {
          groups.get(liftStart.id).visible = liftOverview || selected === liftStart;
          groups.get(liftEnd.id).visible = true;
        }
        const p = localPoint(coordinates);
        routeEyeCamera = null;
        if (trainGuide) {
          trainGuide.setCarVisible(false);
          trainGuide.clearArrows();
          const guided = doorGuide && is3d;
          trail.visible = !guided || ridingLift;
          fig.visible = marker.visible = true;
          const doorShot = guided && floor === "station:IP" && step.kind === "start" && uptownPlatform;
          if (doorShot) {
            // The eastern platform edge adjoins the outer uptown track.
            const ring = uptownPlatform.shape[0].outer;
            const edge = ring.map((a, i) => [a, ring[(i + 1) % ring.length]])
              .filter(([a, b]) => p[1] >= Math.min(a[1], b[1]) && p[1] < Math.max(a[1], b[1]))
              .map(([a, b]) => ({ x: THREE.MathUtils.lerp(a[0], b[0], (p[1] - a[1]) / (b[1] - a[1])), edge: [b[0] - a[0], b[1] - a[1]] }))
              .sort((a, b) => b.x - a.x)[0];
            if (edge && edge.x > p[0]) {
              const door = new THREE.Vector3(edge.x, selected.elev_m, -p[1]);
              const end = new THREE.Vector3(p[0], selected.elev_m, -p[1]);
              const toward = end.clone().sub(door);
              trainGuide.reset({doorEdge: edge.edge}, door, toward, true);
              trainGuide.draw(step, door, end, progress, toward.length(), t => door.clone().lerp(end, t));
              routeEyeCamera = trainGuide.camera;
              routeEyeCamera.aspect = stage.clientWidth / Math.max(1, stage.clientHeight);
              routeEyeCamera.updateProjectionMatrix();
              routeEyeCamera.position.copy(door).lerp(end, progress);

              routeEyeCamera.position.x += .25 * (1 - progress);

            const vertices = segmentPoints.map(point => new THREE.Vector3(point.p[0],
              indoorWalk && byId[point.floor] ? byId[point.floor].elev_m : point.altitude - 1.1, -point.p[1]));

              distance -= run;

              t => span.start.clone().lerp(span.end, t));

          ? [segmentPoints[0], segmentPoints.at(-1)].find(point => point &&
            point.p[0] > 40.6 && point.p[0] < 43.4 && point.p[1] > 34.41 && point.p[1] < 37.21)
          : null;
        cabin.visible = ridingLift || Boolean(storeLanding);
        const [cabinX, cabinY] = storeLanding?.p || p;
        cabin.position.set(cabinX, storeLanding ? selected.elev_m : altitude - 1.1, -cabinY);
        cabin.rotation.y = joinedCpt ? Math.PI / 2 : 0;
        cabin.scale.set(joinedCpt ? 2.8 / 2.4 : 1, 1, joinedCpt ? 2.8 / 2.4 : 1);
        marker.position.set(p[0], altitude, -p[1]);
        fig.position.copy(marker.position);
        const localHeading = heading + theta;
        fig.rotation.y = marker.rotation.y = -localHeading;
        swingLimbs(walking ? Math.sin(phase) * .6 : 0);
        updateSegmentCamera = () => {
          if (!is3d) return;
          const metresPerPixel = 2 * camera.top / camera.zoom / Math.max(1, stage.clientHeight);
          fig.scale.setScalar(THREE.MathUtils.clamp(30 * metresPerPixel, 1.75, 3));
          marker.scale.setScalar(THREE.MathUtils.clamp(7 * metresPerPixel, .48, 1.3));
          if (!segmentFollowing) return;
          const blend = Math.min(1, (performance.now() - zoomStarted) / 750);
          const ease = .12 + .22 * blend;
          target.set(p[0] + Math.sin(localHeading) * 3, altitude + .6, -p[1] - Math.cos(localHeading) * 3);
          if (liftOverview) {
            const low = Math.min(liftStart.elev_m, liftEnd.elev_m);
            const high = Math.max(liftStart.elev_m, liftEnd.elev_m);
            target.set(p[0], (low + high) / 2, -p[1]);
          }
          offset.subVectors(camera.position, controls.target);
          controls.target.lerp(target, ease);
          camera.position.copy(controls.target).add(offset);
          const aspectHeight = stage.clientHeight / Math.max(1, stage.clientWidth);
          const visibleHeight = liftOverview
            ? Math.max(Math.abs(liftEnd.elev_m - liftStart.elev_m) + 35, 145 * aspectHeight)
            : Math.max(17, 24 * aspectHeight);
          camera.zoom = THREE.MathUtils.lerp(camera.zoom, 2 * camera.top / visibleHeight, ease);
          camera.updateProjectionMatrix();
        };
        if (!is3d) {
          const dot = $("segment-dot");
          const [x, y] = segmentPlanProject(p).split(",");
          dot.setAttribute("transform", `translate(${x} ${y}) rotate(${localHeading * 180 / Math.PI})`);
          if (segmentFollowing) {
            segmentPlanCenter = [Number(x), Number(y)];

            zoomPlan(1);
          }
        }
      };
    }
    renderer.setAnimationLoop((now) => {
      routePreview?.(now);
      stationPlayer?.update(now);
      updateSegmentCamera?.();
      controls.update();
      if (viewerMode === "plan") return;
      const eyeCamera = stationPlayer?.viewCamera || routeEyeCamera;
      $("labels").hidden = Boolean(eyeCamera);
      renderer.render(scene, eyeCamera || camera);
      if (!eyeCamera) placeLabels();
    });

    window.floorsView = { data, state, camera, controls, selectFloor, overview, groups, showRouteSegment, resumeRouteFollow, ready: true };
    if (routeSegmentView && window.frameElement) window.frameElement.dispatchEvent(new Event("route-ready"));
  </script>
